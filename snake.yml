# Generates an animated "snake" that eats your GitHub contribution graph,
# then publishes the SVGs to an `output` branch so they can be embedded in README.md.
#
# SETUP
#   1. In your gr8deadpool/gr8deadpool repo, save this file as: .github/workflows/snake.yml
#   2. Settings → Actions → General → Workflow permissions → select
#      "Read and write permissions" → Save.
#   3. Go to the Actions tab → select "generate snake animation" → "Run workflow"
#      (or just wait for the daily schedule below).
#   4. Once it finishes with a green check, an "output" branch will contain the SVGs.
#   5. In README.md, remove the <!-- --> comment markers around the snake block.

name: generate snake animation

on:
  schedule:
    - cron: "0 */24 * * *"   # regenerates once a day
  workflow_dispatch:          # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
